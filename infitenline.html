<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word</title>
    <link rel="icon" type="image/png" href="./word-thing.png">
    <style>
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: inherit, serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            overflow-x: hidden;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100dvh;
            background-color: #e5e5da;
        }

        section {
            padding: clamp(1rem, 4vw, 2rem);
            text-align:center;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            text-align: center;
        }

        a {
            color: #007BFF;
            text-decoration: none;
        }
        button {
            display: block;
            margin: 0 auto;
            padding: 0.5rem 1rem;
            text-align: center;
            border-radius: 20px;
            border: 3px solid #ccc;
            font-size: clamp(1rem, 3vw, 1.2rem);
            cursor: pointer;
        }
        input{
            text-transform: uppercase;
            width: clamp(3rem, 12vw, 5rem);
            height: clamp(3rem, 12vw, 5rem);
            text-align: center;
            font-size: 2rem;
            transition: background-color 0.3s ease;
            background-color: #ccccbb;
            border:none;
        }
        dialog {
            position: relative;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            }
        #status {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: darkgreen;
            margin-top: 1rem;
        }
        #board {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .row1 {
            margin-top: 0.5rem;
        }
        .corner-links {
            display: flex;
            position: fixed;
            bottom: 1vw;
            right: 1vw;
            justify-content: flex-end;
            gap: 0.5rem;
            font-size: 2vw;
        }
        .pulse {
            animation: pulse 0.2s ease;
        }
        .row {
            margin-bottom: 0.2rem;
            gap: 0.3rem;
            display: flex
        }
        input::placeholder{
            font-size: 1.25rem;
            text-align: center;
        }
        dialog::backdrop{
            backdrop-filter: blur(15px);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @media (max-width: 600px) {
            #keyboard button {
                font-size: 0.7rem;
                padding: 0.3rem 0.45rem;
            }
            h2 {
                font-size: 2rem;
            }
            .row1 {
                font-size:0.2vw;
            }
            .row2 {
                font-size:0.2vw;
            }
            .row3 {
                font-size:0.2vw;
            }
            input {
                width: 2.5rem;
                height: 2.5rem;
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

    <section id="project">
        <h1 style="margin-bottom:0.1rem;">Word</h1>
        <h2 style="margin:0.2rem;">Timed</h2>
        <p id = "timer" style = "font-size: 1.5rem; margin-top:0.02rem;">01:00</p>
        <div id = "board">
            <div class = "row">
                <input oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')" inputmode="none" maxlength="1">
                <input oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')" inputmode="none" maxlength="1">
                <input oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')" inputmode="none" maxlength="1">
                <input oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')" inputmode="none" maxlength="1">
                <input oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')" inputmode="none" maxlength="1">
            </div>
        </div>
        <div id = "keyboard">
            <div class="row1">
                <button id = "q"style="display: inline-block">Q</button>
                <button id = "w"style="display: inline-block">W</button>
                <button id = "e"style="display: inline-block">E</button>
                <button id = "r"style="display: inline-block">R</button>
                <button id = "t"style="display: inline-block">T</button>
                <button id = "y"style="display: inline-block">Y</button>
                <button id = "u"style="display: inline-block">U</button>
                <button id = "i"style="display: inline-block">I</button>
                <button id = "o"style="display: inline-block">O</button>
                <button id = "p"style="display: inline-block">P</button>
            </div>
            <div class="row2">
                <button id = "a"style="display: inline-block">A</button>
                <button id = "s"style="display: inline-block">S</button>
                <button id = "d"style="display: inline-block">D</button>
                <button id = "f"style="display: inline-block">F</button>
                <button id = "g"style="display: inline-block">G</button>
                <button id = "h"style="display: inline-block">H</button>
                <button id = "j"style="display: inline-block">J</button>
                <button id = "k"style="display: inline-block">K</button>
                <button id = "l"style="display: inline-block">L</button>
            </div>
            <div class="row3">
                <button id = "enter"style="display: inline-block">Enter</button>
                <button id = "z"style="display: inline-block">Z</button>
                <button id = "x"style="display: inline-block">X</button>
                <button id = "c"style="display: inline-block">C</button>
                <button id = "v"style="display: inline-block">V</button>
                <button id = "b"style="display: inline-block">B</button>
                <button id = "n"style="display: inline-block">N</button>
                <button id = "m"style="display: inline-block">M</button>
                <button id = "backspace"style="display: inline-block">Backspace</button>
            </div>
        </div>
        <p id ="status"></p>
        <div class="corner-links">
            <button onclick="pulse(this);location.href='infinitel.html'">Infinite</button>
            <button onclick="pulse(this);location.href='issue.html'">Spanish Unlimited</button>
            <button onclick="pulse(this);location.href='connect.html'">Connect</button>
            <button onclick="pulse(this);location.href='index.html'">Daily</button>
            <button onclick="pulse(this);location.href='sud.html'">Sud</button>
            <button onclick="pulse(this);time.showModal();">Timer</button>
            <button onclick="pulse(this);settings.showModal();">Settings</button>
        </div>
        <dialog id="time">
            <button class="close-btn" style ="top: 2.5px; right: 2.5px;" aria-label="close">&times;</button>
            <input type="number" id="minutesInput" style="margin-bottom: 10px; width: 200px; height: 60px; border-radius: 20px;" placeholder="Enter minutes" step="0.25" min="0.25">
            <button id="startTimBtn" onclick="startTimer();">Start Timer</button>
        </dialog>
    </section>
        <dialog id="lose">
            <button class="close-btn" aria-label="close">&times;</button>
            <p style="font-size: 1.5rem; font-weight: bold; color: red;text-align: center;">You lost!</p>
            <p id="score" style="font-size:1.5rem;font-weight:bold;color:red;text-align: center;"></p>
        </dialog>
        <dialog id="tlose">
            <button class="close-btn" aria-label="close">&times;</button>
            <p style="font-size: 1.5rem; font-weight: bold; color: red;text-align: center;">You ran out of time!</p>
            <p id="tscore" style="font-size:1.5rem;font-weight:bold;color:green;text-align: center;"></p>
        </dialog>
        <dialog id="settings">
            <input type="checkbox" name="aniSkip" value="aniSkipy" id="skipAni" style="width:20px;height:20px;"> Skip Animation
            <button onclick="pulse(this)" id="save">Save</button>
            <button class="close-btn" aria-label="close">&times;</button>
        </dialog>
    <script>
        let countdown;
        let numgot = 0;
        let word = "";
        let dis = false;
        let words = [];
        let guessNum = 0;
        let ana = true;
        function pulse(element) {
            element.classList.remove("pulse");

            void element.offsetWidth;

            element.classList.add("pulse");
        }
        async function loadWords(){
            const response = await fetch("./valid-words.txt");
            const text = await response.text();
            words = text.split("\n").map(wordy => wordy.trim().toLowerCase());
        }
        async function loadWordy(){
            const response = await fetch("./word-answers.txt");
            const data = await response.text();
            word = data.trim().toLowerCase();
            word = word.split("\n")[Math.floor(Math.random() * 2315)].trim();
        }
        async function init() {
            await loadWordy();
            await loadWords();
            getActiveInput().focus();
        }
        init();
        let wins = false;
        async function reseten(){
            numgot++;
            dis = false;
            await loadWordy();
            guessNum = 0;
            status.textContent = "";
            board.innerHTML = "";
            const nRow = document.createElement("div");
            nRow.className = "row";
            for (let i = 0; i < 5; i++){
                const input = document.createElement("input");
                input.maxLength = 1;
                setUpInput(input);
                nRow.appendChild(input);
            }
            board.appendChild(nRow);
            nRow.querySelector("input").focus();
            document.querySelectorAll("#keyboard button").forEach(btn => {
                btn.style.backgroundColor = "";
                btn.style.color = "black";
            });
            wins = false;
        }
        const lose = document.getElementById("lose");
        lose.querySelector(".close-btn").addEventListener("click", () => {
            lose.close();
        });
        const tlose = document.getElementById("tlose");
        tlose.querySelector(".close-btn").addEventListener("click", () => {
            tlose.close();
        });
        const settings = document.getElementById("settings");
        settings.querySelector(".close-btn").addEventListener("click", () => {
            settings.close();
        });
        const teme = document.getElementById("time");
        teme.querySelector(".close-btn").addEventListener("click", () => {
            teme.close();
        });
        const q = document.getElementById("q");
        const w = document.getElementById("w");
        const e = document.getElementById("e");
        const r = document.getElementById("r");
        const t = document.getElementById("t");
        const y = document.getElementById("y");
        const u = document.getElementById("u");
        const i = document.getElementById("i");
        const o = document.getElementById("o");
        const p = document.getElementById("p");
        const a = document.getElementById("a");
        const s = document.getElementById("s");
        const d = document.getElementById("d");
        const f = document.getElementById("f");
        const g = document.getElementById("g");
        const h = document.getElementById("h");
        const j = document.getElementById("j");
        const k = document.getElementById("k");
        const l = document.getElementById("l");
        const z = document.getElementById("z");
        const x = document.getElementById("x");
        const c = document.getElementById("c");
        const v = document.getElementById("v");
        const b = document.getElementById("b");
        const n = document.getElementById("n");
        const m = document.getElementById("m");
        const enter = document.getElementById("enter");
        const backspace = document.getElementById("backspace");
        let stop = false;
        const keyButtons = {};
        "abcdefghijklmnopqrstuvwxyz".split("").forEach(letter => {
            keyButtons[letter] = document.getElementById(letter);
        });
        function getActiveInput() {
            const cuRow = board.lastElementChild;
            const inputs = cuRow.querySelectorAll("input");
            return Array.from(inputs).find(input => input.value === "");
        }
        function startTimer(){
            document.getElementById("time").close();
            clearInterval(countdown);
            reseten();
            numgot = 0;
            let secs = document.getElementById("minutesInput").value * 60;
            countdown = setInterval(() => {
                if (!settings.open){
                    secs--;
                }
                let minutes = Math.floor(secs / 60);
                let seconds = secs % 60;
                let dispMins = minutes < 10 ? "0" + minutes : minutes;
                let dispSecs = seconds < 10 ? "0" + seconds : seconds;
                document.getElementById("timer").textContent = dispMins + ":" + dispSecs;
                if (secs <= 0) {
                    clearInterval(countdown);
                    document.getElementById("tscore").textContent = `You got ${numgot} words.`;
                    tlose.showModal();
                    document.querySelectorAll("input").forEach(inp => {
                        if (inp.id !== "minutesInput") inp.readOnly = true;
                    });
                    status.textContent = `You ran out of time, it was: ${word.toUpperCase()}`;
                    status.style.color = "red";
                }
            }, 1000);
        }
        const skipAni = document.querySelector('input[name="aniSkip"][value="aniSkipy"]');
        document.getElementById("save").addEventListener("click", function() {
            if (skipAni.checked) {
                ana = false;
            }
            else {
                ana = true;
            }
        });
        document.getElementById("keyboard").addEventListener("click", (e) => {
            if (e.target.tagName !== "BUTTON") return;
            const key = e.target.id;
            if (keyButtons[key]) {
                pulse(keyButtons[key]);
            }
            const activeInput = getActiveInput();
            if (!activeInput && key !== "enter" && key !== "backspace") return;
            if (!activeInput|| !activeInput.readOnly){
                if (key === "enter" && dis === false) {
                    guesser();
                } else if (key === "backspace" && wins === false && dis === false) {
                    const cuRow = board.lastElementChild;
                    const inputs = Array.from(cuRow.querySelectorAll("input"));
                    const lastFilled = inputs.reverse().find(input => input.value !== "");
                    if (lastFilled) {
                        lastFilled.value = "";
                        lastFilled.focus();
                    }
                } else if (key.length === 1 && activeInput) {
                    activeInput.value = key;
                    activeInput.dispatchEvent(new Event("input"));
                    }
            }
        });
        const status = document.getElementById("status");
        const board = document.getElementById("board");
        function setUpInput(input){
            input.addEventListener("input", () => {
                input.value = input.value.toLowerCase();

                if (input.value.length === 1){
                    const next = input.nextElementSibling;

                    if (next){
                        next.focus();
                    }
                }
            });

            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && input.value === ""){
                    const previous = input.previousElementSibling;

                    if (previous){
                        previous.focus();
                    }
                }
            });
        }
        document.querySelectorAll("input").forEach(setUpInput);
        async function guesser(){
            dis = true;
            const used = [false, false, false, false, false];
            const rows = board.querySelectorAll(".row");
            const cuRow = rows[guessNum]
            const res = cuRow.querySelectorAll("input");
            let guess = "";
            res.forEach((input, i) => {
                guess += input.value.toLowerCase();
            });
            if (guess.length !== 5) {
                status.textContent = "Enter 5 letters";
                status.style.color = "red";
                dis = false;
                setTimeout(() => {
                    status.textContent = "";
                }, 2000);
                return;
            }
            if (words.includes(guess)){
                let temp = word.split("");
                for (let i = 0; i < res.length; i++) {
                    const input = res[i];
                    input.readOnly = true;
                    if (guess[i] === temp[i]) {
                        used[i] = true;
                    }
                };
                const gree = "rgb(87, 175, 84)";
                const yell = "rgb(204, 204, 79)";
                const gra = "rgb(126, 130, 129)";
                for (let i = 0; i < res.length; i++) {
                    const input = res[i];
                    const index = temp.indexOf(guess[i]);
                    if (guess[i] === temp[i]) {
                        input.style.backgroundColor = gree;
                        keyButtons[guess[i]].style.backgroundColor = gree;
                        keyButtons[guess[i]].style.color = "white";
                        input.readOnly = true;
                        if (ana){
                            input.classList.add("pulse");
                            setTimeout(() => {
                                input.classList.remove("pulse");
                            }, 200);
                            keyButtons[guess[i]].classList.add("pulse");
                            setTimeout(() => {
                                keyButtons[guess[i]].classList.remove("pulse");
                            }, 200);
                            await new Promise(resolve => setTimeout(resolve, 250));
                        }
                    }
                    else if (index !== -1 && !used[index]) {
                        input.style.backgroundColor = yell;
                        if (getComputedStyle(keyButtons[guess[i]]).backgroundColor !== gree){
                            keyButtons[guess[i]].style.backgroundColor = yell;
                        }
                        keyButtons[guess[i]].style.color = "white";
                        temp[index] = null;
                        used[index] = true;
                        if (ana){
                            input.classList.add("pulse");
                            setTimeout(() => {
                                input.classList.remove("pulse");
                            }, 200);
                            keyButtons[guess[i]].classList.add("pulse");
                            setTimeout(() => {
                                keyButtons[guess[i]].classList.remove("pulse");
                            }, 200);
                            await new Promise(resolve => setTimeout(resolve, 250));
                        }
                    } else {
                        input.style.backgroundColor = gra;
                        if (getComputedStyle(keyButtons[guess[i]]).backgroundColor !== yell && getComputedStyle(keyButtons[guess[i]]).backgroundColor !== gree){
                            keyButtons[guess[i]].style.backgroundColor = gra;
                        }
                        keyButtons[guess[i]].style.color = "white";
                        if (ana){
                            input.classList.add("pulse");
                            setTimeout(() => {
                                input.classList.remove("pulse");
                            }, 200);
                            keyButtons[guess[i]].classList.add("pulse");
                            setTimeout(() => {
                                keyButtons[guess[i]].classList.remove("pulse");
                            }, 200);
                            await new Promise(resolve => setTimeout(resolve, 250));
                        }
                    }
                    input.style.color = "white";
                    input.readOnly = true;
                };
                    guess = guess.toLowerCase();
                    if (guess === word){
                        for (key in keyButtons){
                            keyButtons[key].style.color = "black";
                        }
                        wins = true;
                        reseten();
                        return;
                    }
                    guessNum += 1;
                    if (guessNum > 5){
                        document.querySelectorAll("input").forEach(inp => {
                            if (inp.id !== "minutesInput") inp.readOnly = true;
                        });
                        status.textContent = `You lose, it was: ${word.toUpperCase()}`;
                        status.style.color = "red";
                        clearInterval(countdown);
                        document.getElementById("score").textContent = `You got ${numgot} words.`;
                        lose.showModal();
                        return;
                    }
                    const nRow = document.createElement("div");
                    nRow.className = "row";
                    for (let i = 0; i < 5; i++){
                        const input = document.createElement("input");
                        input.maxLength = 1;
                        input.addEventListener('input', function() {
                        this.value = this.value.replace(/[^a-zA-Z]/g, '');
                        });
                        input.inputMode = "none";
                        setUpInput(input);
                        nRow.appendChild(input);
                    }
                    board.appendChild(nRow);
                    nRow.querySelector("input").focus();
                    dis = false;
            } else {
                status.textContent = "Enter a real word";
                status.style.color = "red";
                dis = false;
                setTimeout(() => {
                    status.textContent = "";
                }, 2000);
            }
        };
        document.addEventListener("keydown",(e) => {
            if (e.key === "Enter" && dis === false){
                guesser();
            }
        });

    </script>
</body>
</html>
