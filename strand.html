<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word</title>
    <link rel="icon" type="image/png" href="./word-thing.png">
    <style>
        html, body {
            height: 100%;
            overflow-x: hidden;
            user-select: none;
        }
        body {
            font-family: inherit, serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            overflow-x: hidden;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100dvh;
            background-color: #e5e5da;
        }

        section {
            padding: clamp(1rem, 4vw, 2rem);
            text-align:center;
        }

        h1 {
            font-size: clamp(1.4rem, 4.2vw, 2.6rem);
            text-align: center;
            display: block;
            min-height: clamp(2.9rem, 6.2vw, 3.9rem);
        }

        a {
            color: #007BFF;
            text-decoration: none;
        }
        button {
            width: 7dvh;
            height: 7dvh;
            border-radius: 40%;
            border: none;
            background-color: #e5e5da;
            font-size: 2rem;
        }
        input{
            text-transform: uppercase;
            width: clamp(3rem, 12vw, 5rem);
            height: clamp(3rem, 12vw, 5rem);
            text-align: center;
            font-size: 2rem;
            transition: background-color 0.3s ease;
            background-color: #ccccbb;
            border:none;
        }
        dialog {
            position: relative;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            }
        #status {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: darkgreen;
            margin-top: 1rem;
        }
        #board {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        #selectedWord {
            border: black 1px;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .row1 {
            margin-top: 0.5rem;
        }
        .corner-link {
            position: fixed;
            bottom: 1vw;
            right: 1vw;
            background: #fff;
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
            font-size: 1.5vw;
        }
        .corner-links {
            display: flex;
            position: fixed;
            bottom: 1vw;
            right: 1vw;
            justify-content: flex-end;
            gap: 0.5rem;
            font-size: 2vw;
        }
        .pulse {
            animation: pulse 0.2s ease;
        }
        .row {
            margin-bottom: 1rem;
            gap: 0.15rem;
            display: flex;
            height: 100%;
            flex-direction: column;
            border-top: 0.3rem solid #000;
            border-bottom: 0.3rem solid #000;
        }
        .selected{
            background-color: #DBD8C5;
        }
        #hintButton {
            position: fixed;
            border: 1px solid #000;
            width: 9vw;
            font-size: 5vw;
            border-radius: 50%;
            background-color: white;
            top: 45%;
            left: 10%;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @media (max-width: 600px) {
            #keyboard button {
                font-size: 0.7rem;
                padding: 0.3rem 0.45rem;
            }
            h2 {
                font-size: 2rem;
            }
            .row1 {
                font-size:0.2vw;
            }
            .row2 {
                font-size:0.2vw;
            }
            .row3 {
                font-size:0.2vw;
            }
            input {
                width: 2.5rem;
                height: 2.5rem;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <h1 id = "theme"></h1>
    <h1 id = "selectedWord"></h1>
    <div>
        <button id = "hintButton">Hint</button>
        <div id = "board"></div>
    </div>
    <h1 id = "status"></h1>
    <script>
        let hintMeter = 0;
        let pastWords = [];
        const status = document.getElementById("status");
        const themeHeader = document.getElementById("theme");
        const selectedWord = document.getElementById("selectedWord");
        let selectedLetters = [];
        let lastSelectedButton = [];
        const board = document.getElementById("board");
        async function getStrandsData() {
            const response = await fetch('https://strandsgames.org/api/v1/strands/today/', {
                headers: {
                'Accept': 'application/json'
                }
            });
            const data = await response.json();
            const answers = data.theme_words;
            const spangram = data.spangram;
            const theme = data.theme_clue;
            const all_solutions = data.all_solutions;
            themeHeader.textContent = theme;
            return { ...data, answers, spangram, all_solutions};
        }

        async function makeBoard() {
            const puzzle = await getStrandsData();
            for (let i = 0; i < 6; i++){
                let row = document.createElement("div");
                row.classList.add("row");
                board.appendChild(row);
                for (let j = 0; j < 8; j++){
                    let letter = document.createElement("button");
                    letter.textContent = puzzle.grid[j][i];
                    row.appendChild(letter);
                    letter.addEventListener("mousedown", () => {
                        if(lastSelectedButton.length < 1 || checkIfNear(letter, lastSelectedButton.at(-1))) {
                            toggleSelect(letter);
                        }
                    });
                    letter.addEventListener("mouseup", () => {
                        checkWord(selectedLetters.join('').toUpperCase());
                    });

                    letter.addEventListener("mouseenter", () => {
                        if (event.buttons === 1 && (lastSelectedButton.length < 1 || checkIfNear(letter, lastSelectedButton.at(-1)))) {
                            toggleSelect(letter);
                        }
                    });
                }
            }
        }

        function checkIfNear(button1, button2) {
            const row1 = button1.parentElement;
            const row2 = button2.parentElement;
            const row1Index = Array.from(board.children).indexOf(row1);
            const row2Index = Array.from(board.children).indexOf(row2);
            if (Math.abs(row1Index - row2Index) > 1) return false;
            if (Math.abs(Array.from(row1.children).indexOf(button1) - Array.from(row2.children).indexOf(button2)) > 1) return false;
            return true;
        }

        async function checkWord(word) {
            const puzzle = await getStrandsData();
            for (const button of lastSelectedButton) {
                    button.classList.remove("selected");
                    lastSelectedButton = [];
                    selectedLetters = [];
                    selectedWord.textContent = '';
            }
            if (puzzle.answers.includes(word) || word === puzzle.spangram.toUpperCase()) {
                status.textContent = "Good job!";
                setTimeout(() => {
                    status.textContent = "";
                }, 1000);
                return 1;
            } else if (puzzle.all_solutions.includes(word)) {
                if (pastWords.includes(word)) {
                    status.style.color = "red";
                    status.textContent = "You've already used this word";
                    setTimeout(() => {
                        status.textContent = "";
                        status.style.color = "green";
                    }, 1000);
                    return 0;
                }
                status.textContent = "You got a word";
                setTimeout(() => {
                    status.textContent = "";
                }, 1000);
                hintMeter++;
                console.log(hintMeter);
                pastWords.push(word);
                return 2;
            }
            return 0;
        }

        function toggleSelect(button) {
            if (button.classList.contains("selected") && button === lastSelectedButton.at(-1)) {
                checkWord(selectedLetters.join('').toUpperCase());
                if (checkWord(selectedLetters.join('').toUpperCase()) !== 1) {
                    for (const button of lastSelectedButton) {
                        button.classList.remove("selected");
                    }
                    lastSelectedButton = [];
                    selectedLetters = [];
                    selectedWord.textContent = '';
                }
                button.classList.remove("selected");
                const index = selectedLetters.lastIndexOf(button.textContent);
                if (index !== -1) {
                    selectedLetters.splice(index, 1);
                }
                lastSelectedButton.pop();
            } else if (!button.classList.contains("selected")) {
                lastSelectedButton.push(button);
                button.classList.add("selected");
                selectedLetters.push(button.textContent);
            }
            selectedWord.textContent = selectedLetters.join('');
        }
        
        makeBoard();
    </script>
</body>
</html>
